
name: Java CI with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: ./mvnw clean package

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: study-session-tracker
          path: target/cen4802-0.0.1-SNAPSHOT.jar

      - name: Build Docker image
        run: docker build -t study-session-tracker:latest .

      - name: Save Docker image
        run: docker save study-session-tracker:latest -o study-session-tracker.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: study-session-tracker-docker
          path: study-session-tracker.tar
