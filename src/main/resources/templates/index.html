
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Session Tracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container">

    <header>
        <h1>Study Session Tracker</h1>
        <p>Track your study time one session at a time.</p>
    </header>

    <div class="card">
        <h2>Add Study Session</h2>

        <form th:action="@{/sessions}" method="post">
            <label for="courseName">Course Name</label>
            <input type="text"
                   id="courseName"
                   name="courseName"
                   placeholder="Example: CEN 4802"
                   required>

            <label for="minutes">Minutes Studied</label>
            <input type="number"
                   id="minutes"
                   name="minutes"
                   min="1"
                   required>

            <button type="submit">Add Session</button>
        </form>
    </div>

    <div class="card">
        <h2>Study Summary</h2>

        <p>
            Total Minutes:
            <strong th:text="${totalMinutes}">0</strong>
        </p>

        <p>
            Total Study Sessions:
            <strong th:text="${totalSessions}">0</strong>
        </p>

        <h2>Recorded Sessions</h2>

        <table>
            <thead>
            <tr>
                <th>Course</th>
                <th>Minutes</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="studySession, stat : ${sessions}">
                <td th:text="${studySession.courseName}">Java</td>
                <td th:text="${studySession.minutes}">30</td>
                <td>
                    <form th:action="@{/sessions/delete}" method="post">
                        <input type="hidden" name="index" th:value="${stat.index}">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
