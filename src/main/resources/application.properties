
spring.application.name=cen4802

# Application logging
logging.level.root=INFO
logging.level.com.pedro.cen4802=DEBUG

# Save logs to a file
logging.file.name=logs/study-session.log

# Include timestamps, levels, and messages
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
